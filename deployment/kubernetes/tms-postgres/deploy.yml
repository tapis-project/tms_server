apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-postgres-18
spec:
  selector:
    matchLabels:
      app: tms-postgres-18
  template:
    metadata:
      labels:
        app: tms-postgres-18
    spec:
      containers:
      - name: tms-postgres-18
        image: postgres:18.6
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: PGDATA
          value: "/pgdata/data"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tms-secrets
              key: postgres-password
        volumeMounts:
        - name: tms-postgres-data
          mountPath: "/pgdata"
      volumes:
      - name: tms-postgres-data
        persistentVolumeClaim:
          claimName: tms-postgres-18-vol
