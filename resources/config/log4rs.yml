# To change the log file location, replace the roller.path and roller.policy.roller.pattern values below.
# fout.path will also need to be change if it's being used.
#
# By default, rootdir = $HOME/.tms. Note that shell macros like ~ cannot be used, use an absolute path instead.
#
# Note the use of the jinja2-like template variable TMS_ROOT_DIR. During a clean install this gets replaced by the
# rootdir of the tms_server.
# If this file is copied to a new rootdir after installation, manual adjustment of the paths will be needed.

refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%dT%H:%M:%S.%f)(utc)}Z {l:<5} [{T}] {f:>.100}:{L} - {m}{n}"

#  fout:
#    kind: file
#    path: "/home/tms/tms/logs/tms.log"
#    encoder:
#      pattern: "{d(%Y-%m-%dT%H:%M:%S.%f)(utc)}Z {l:<5} [{T}] {f:>.100}:{L} - {m}{n}"

  roller:
    kind: rolling_file
    append: true
    path: "/home/tms/tms/logs/tms_roller.log"
    encoder:
      kind: pattern
      pattern: "{d(%Y-%m-%dT%H:%M:%S.%f)(utc)}Z {l:<5} [{T}] {f:>.100}:{L} - {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 20 mb
      roller:
        kind: fixed_window
        base: 1
        count: 3
        pattern: "/home/tms/tms/logs/tms_roller{}.log"
        
root:
  level: warn
  appenders:
    - stdout
    - roller

loggers:
  tms_server:
    level: debug
    appenders:
      - stdout
      - roller
    additive: false
